name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.1  # keep in sync with .pre-commit-config.yaml

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Install test dependencies
        # The project itself, not just pytest: the docstring-budget tests
        # register the real tools on a real FastMCP and measure what
        # list_tools() sends, and pyproject.toml owns the mcp version bounds.
        run: pip install -e . pytest

      - name: Unit tests
        # Live tests that mutate a running simulator are opt-in via
        # ISAAC_MCP_LIVE_TESTS and stay skipped here; these are the contract
        # tests, and nothing should publish without them.
        run: pytest -q
